name: App Manager CI
on:
  push:
    branches: [main, preprod, staging, develop]
  pull_request:
    branches: [main, preprod, staging, develop]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      # Bloquant, toutes gravites, dev compris : objectif 0 vulnerabilite.
      # picomatch est remplace par vendor/picomatch (correctif de
      # GHSA-fc5q-39xc-vjpf, aucune version corrigee publiee) : voir
      # vendor/picomatch/CORRECTIF.md.
      - name: Vulnerabilites des dependances (npm audit)
        run: npm audit
      - run: npm run build
