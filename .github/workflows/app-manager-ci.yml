name: App Manager CI
on:
  push:
    branches: [main, preprod, staging, develop]
  pull_request:
    branches: [main, preprod, staging, develop]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      # Bloquant : seulement ce qui est livre aux utilisateurs (dependencies).
      - name: Vulnerabilites des dependances de production (npm audit)
        run: npm audit --omit=dev --audit-level=high
      # Outils de developpement (vite, vitest, eslint) : rapport sans bloquer,
      # une alerte sans version corrigee ne doit pas arreter les PR.
      - name: Vulnerabilites des outils de developpement (npm audit, informatif)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run build
